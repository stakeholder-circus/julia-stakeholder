name: ci-native

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.11'
      - run: julia --project=. -e 'using Pkg; Pkg.test()'
      - run: python3 scripts/validate_scaffold.py
