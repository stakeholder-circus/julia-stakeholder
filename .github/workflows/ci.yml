name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.11'
      - name: Test
        run: julia --project=. -e 'using Pkg; Pkg.test()'
      - name: Validate
        run: python3 scripts/validate_scaffold.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build image
        run: docker build -t julia-stakeholder .
      - name: Smoke test
        run: docker run --rm julia-stakeholder --list-values
