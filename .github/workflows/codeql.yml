name: codeql

on:
  push:
  pull_request:
  schedule:
    - cron: '19 3 * * 1'

permissions:
  contents: read

jobs:
  julia-codeql-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: echo "CodeQL does not currently analyze Julia in this repo; native and Docker workflows are authoritative."
